name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Validação (Instalação, Lint e Build de Teste)
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Test Build
        # Roda um build local no runner para garantir que nada quebra antes de gerar a imagem
        run: pnpm build

  # 2. Build e Push da Imagem Docker
  build-and-push:
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastrelax-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Deploy no Droplet DigitalOcean
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            # 1. Puxa a nova imagem do frontend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fastrelax-web:latest

            # 2. Para e remove o container em execução (se existir)
            docker stop frontend || true
            docker rm frontend || true

            # 3. Sobe o container conectado na rede 'fastrelax-network'
            # Expõe a porta interna 3000 na porta 80 pública do servidor
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              --network fastrelax-network \
              -p 80:3000 \
              -e FASTRELAX_API_URL="${{ secrets.FASTRELAX_API_URL }}" \
              -e SESSION_COOKIE_SECURE="${{ secrets.SESSION_COOKIE_SECURE }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/fastrelax-web:latest

            # 4. Limpa imagens dangling
            docker image prune -f